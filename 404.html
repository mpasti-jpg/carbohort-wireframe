<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nie znaleziono strony – prototyp Carbohort</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1a1a1a; --muted:#6b6b6b; --line:#d8d8d8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#ececec; --muted:#9a9a9a; --line:#333; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width:36rem; margin:0 auto; padding:4rem 1.25rem; }
  h1 { font-size:1.4rem; margin:0 0 .6rem; }
  p { color:var(--muted); }
  a { color:inherit; }
  .btn { display:inline-block; margin-top:1rem; border:1px solid var(--line); border-radius:.35rem; padding:.4rem .8rem; text-decoration:none; }
  .btn:hover { border-color:var(--fg); }
</style>
<script>
// Stare adresy sprzed reorganizacji repo (bez numeru wersji w ścieżce)
// kierujemy na aktualną linię rozwojową, zachowując nazwę pliku.
(function () {
  var LATEST = 'v5';
  var base = '/carbohort-wireframe/';
  var path = location.pathname;
  if (path.indexOf(base) !== 0) return;
  var rest = path.slice(base.length);
  if (rest === '' || /^v\d+(\/|$)/.test(rest)) return; // już wersjonowane – zostaw 404
  location.replace(base + LATEST + '/' + rest + location.search + location.hash);
})();
</script>
</head>
<body>
<div class="wrap">
  <h1>Nie znaleziono strony</h1>
  <p>Ten adres nie istnieje w prototypie. Makiety są podzielone na wersje – wybierz wersję na stronie startowej.</p>
  <a class="btn" href="/carbohort-wireframe/">Lista wersji prototypu</a>
</div>
</body>
</html>
