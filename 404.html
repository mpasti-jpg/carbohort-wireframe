// folder, or under a folder that is no longer published, goes to the same page
// in the current folder. Anything else stays on this error page.
function cwRedirectTarget(pathname, search, hash) {
  var base = '/carbohort-wireframe/';
  var current = 'v7';
  if (pathname.indexOf(base) !== 0) return null;
  var rest = pathname.slice(base.length);
  if (rest === '' || rest === 'index.html') return base + 'stan-podstron.html' + hash;
  var old = /^v[456](?:\/(.*))?$/i.exec(rest);
  if (old) {
    var tail = old[1] || '';
    if (tail === '' || tail === 'index.html') tail = 'home.html';
    return base + current + '/' + tail + search + hash;
  }
  if (/^v\d+(\/|$)/i.test(rest)) return null;      // current folder: a real 404
  if (/^ce-indeks(\/|$)/.test(rest)) return null;   // root-level tool files
  return base + current + '/' + rest + search + hash;
}
(function () {
  var to = cwRedirectTarget(location.pathname, location.search, location.hash);
  if (to) location.replace(to);
})();
