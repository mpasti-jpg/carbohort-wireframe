<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Indeks CE – CarboHort</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap">
<style>
/* Layout: thin crear brand bar and a low header that scroll away; below them two columns –
   a collapsible filter panel (sticky, own scroll; a drawer under 900px) and the main column:
   a one-line sticky status row over a grid of screenshots grouped by family. Grid columns follow
   the main column's width, not the window. Modal viewer = screenshot on the left, facts on the right.
   Tool branding (crear): greys and white, Instrument Sans. Colour only where it carries state. */
:root {
  --bg: #ffffff;
  --fg: #1d1d1e;
  --muted: #778181;
  --line: #dfdfdf;
  --line-strong: #adb0b1;
  --accent: #1d1d1e;
  --field: #ffffff;
  --accent-soft: #ebebeb;
  --on-accent: #ffffff;
  --frame: #ebebeb;            /* ground behind a thumbnail */
  --shot-dim: 1;               /* brightness of thumbnails */
  --backdrop: rgba(29, 29, 30, .62);
  --st-natywny: #2b7a53;       /* project state: native design */
  --st-przygotowanie: #2c62a8; /* project state: design to prepare */
  --st-brak: #778181;          /* project state: none – a neutral state, not an error */

  --font-sans: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: var(--font-sans);   /* one family in the tool; codes get tabular figures */
  --fs-xs: .6875rem;
  --fs-s: .75rem;
  --fs-m: .8125rem;
  --fs-l: .9375rem;
  --fs-xl: 1.5rem;
  --r: 2px;
  --gutter: clamp(16px, 2vw, 28px);
  --side-w: 288px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d1d1e; --fg: #ebebeb; --muted: #adb0b1; --line: #38393a; --line-strong: #778181;
    --accent: #ffffff; --field: #252526; --accent-soft: #303132; --on-accent: #1d1d1e;
    --frame: #2a2a2b; --shot-dim: .86; --backdrop: rgba(0, 0, 0, .72);
    --st-natywny: #6cc497; --st-przygotowanie: #86b4f2; --st-brak: #adb0b1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d1d1e; --fg: #ebebeb; --muted: #adb0b1; --line: #38393a; --line-strong: #778181;
  --accent: #ffffff; --field: #252526; --accent-soft: #303132; --on-accent: #1d1d1e;
  --frame: #2a2a2b; --shot-dim: .86; --backdrop: rgba(0, 0, 0, .72);
  --st-natywny: #6cc497; --st-przygotowanie: #86b4f2; --st-brak: #adb0b1;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html.is-locked { overflow: hidden; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 var(--fs-m)/1.45 var(--font-sans);
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; }
a { color: var(--accent); text-underline-offset: 2px; }
img { max-width: 100%; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.mono { font-family: var(--font-mono); }

/* ---------- brand bar ---------- */
.brand { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 28px; padding: 0 var(--gutter); border-bottom: 1px solid var(--line); }
.brand-logo { display: flex; color: var(--fg); }
.brand-logo svg { display: block; height: 9.75px; width: auto; }
.brand-ver { font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.badge--code, .card-code, .dlg-code { font-variant-numeric: tabular-nums; letter-spacing: .02em; }

/* ---------- header (not sticky, scrolls away) ---------- */
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 14px; padding: 14px var(--gutter) 11px; }
.top h1 { margin: 0; font-size: var(--fs-xl); font-weight: 650; line-height: 1.2; letter-spacing: -.015em; }
.top p { margin: 0; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- controls ---------- */
.input, .btn, .seg button {
  height: 28px; border: 1px solid var(--line-strong); border-radius: var(--r);
  background: var(--field); font-size: var(--fs-s);
}
.input { padding: 0 8px; min-width: 0; }
select.input { padding-right: 4px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 0 10px; white-space: nowrap; text-decoration: none; color: var(--fg); }
.btn:hover:not(:disabled):not([aria-disabled="true"]), .seg button:hover { border-color: var(--accent); }
.btn:disabled, .btn[aria-disabled="true"] { color: var(--muted); border-color: var(--line); background: transparent; cursor: default; }
.btn[aria-expanded="true"], .btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); }
.btn--icon { width: 28px; padding: 0; justify-content: center; }
.btn--s { height: 24px; padding: 0 8px; }
.btn-n { font-variant-numeric: tabular-nums; background: var(--accent); color: var(--on-accent); padding: 0 5px; border-radius: var(--r); font-size: var(--fs-xs); }
.btn .ico { display: block; flex: none; }
.seg { display: inline-flex; }
.seg button { padding: 0 9px; white-space: nowrap; }
.seg button + button { margin-left: -1px; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); position: relative; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-s); font-variant-numeric: tabular-nums; }
.check input { margin: 0; accent-color: var(--accent); }

.pill {
  display: inline-flex; align-items: center; gap: 5px; min-height: 24px; max-width: 100%; padding: 2px 7px;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--field);
  font-size: var(--fs-s); line-height: 1.25; text-align: left;
}
.pill:hover { border-color: var(--line-strong); }
.pill-t { min-width: 0; overflow-wrap: anywhere; }
.pill .n { flex: none; font-size: var(--fs-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.pill.is-zero { color: var(--muted); background: transparent; }
.pill.is-zero .pill-t, .pill.is-zero .n, .pill.is-zero .mk { opacity: .55; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pill[aria-pressed="true"] .n { color: inherit; opacity: .8; }
.pill[aria-pressed="true"] .pill-t, .pill[aria-pressed="true"] .mk { opacity: 1; }
.pill[aria-pressed="true"] .mk { --st-natywny: currentColor; --st-przygotowanie: currentColor; --st-brak: currentColor; --line-strong: currentColor; }

/* ---------- shell: filter panel + main column ---------- */
.shell { display: flex; align-items: flex-start; border-top: 1px solid var(--line); }
.content { flex: 1 1 0; min-width: 0; container: maincol / inline-size; }
.side {
  flex: none; width: var(--side-w);
  position: sticky; top: env(safe-area-inset-top, 0px);
  /* --side-off = how much of the page header is still above the panel (set on scroll) */
  height: calc(100vh - var(--side-off, 0px));
  height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - var(--side-off, 0px));
  display: flex; flex-direction: column;
  overflow-x: hidden; overflow-y: auto;
  background: var(--bg); border-right: 1px solid var(--line);
}
.side > * { flex: none; }
.side-head { display: none; }
.side-title { margin: 0; font-size: var(--fs-m); font-weight: 650; }
.side-title span { margin-left: 8px; font-size: var(--fs-s); font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.side-sec { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px 16px 12px var(--gutter); }
/* the search row stays at the top of the panel and lines up with the status row next to it */
.side-search { position: sticky; top: 0; z-index: 1; padding-block: 6px; background: var(--bg); border-bottom: 1px solid var(--line); }
.side-label, .fg-name { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.side-label { margin: 0; }
.side .input { width: 100%; }
.side .seg { display: flex; }
.side .seg button { flex: 1 1 0; min-width: 0; }

/* facet = collapsible group; the header carries the number of active values */
.fg { border-top: 1px solid var(--line); }
.fg-sum {
  display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 16px 0 var(--gutter);
  cursor: pointer; list-style: none; -webkit-user-select: none; user-select: none;
}
.fg-sum::-webkit-details-marker { display: none; }
.fg-sum:focus-visible { outline-offset: -2px; }
.fg-sum:hover .fg-name, .fg[open] > .fg-sum .fg-name { color: var(--fg); }
.fg-chev { flex: none; width: 6px; height: 6px; margin-left: auto; border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: translateY(-2px) rotate(45deg); }
.fg[open] > .fg-sum .fg-chev { transform: translateY(1px) rotate(225deg); }
.fg-pills { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 16px 12px var(--gutter); }

.side-foot {
  position: sticky; bottom: 0; z-index: 1; margin-top: auto;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px;
  padding: 10px 16px 12px var(--gutter);
  background: var(--bg); border-top: 1px solid var(--line);
}
.side-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.note { margin: 0; font-size: var(--fs-xs); line-height: 1.35; color: var(--muted); }
.note--status { color: var(--fg); font-weight: 600; }
.note--status:empty { display: none; }
.manual { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
.manual label { font-size: var(--fs-s); }
.manual textarea { width: 100%; min-height: 7.5rem; padding: 8px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--field); font: var(--fs-s)/1.4 var(--font-mono); resize: vertical; }
.manual .btn { justify-self: start; }
@media (max-height: 560px) { .side-foot, .side-search { position: static; } }

/* ---------- status row: sticky, one line at rest ---------- */
.status {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px;
  padding: 6px var(--gutter);
  background: var(--bg); border-bottom: 1px solid var(--line);
}
.status .btn { flex: none; }
.count { flex: none; min-width: 8.4em; font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.chips { display: contents; }
.fchip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 24px; max-width: 100%; padding: 2px 6px 2px 8px;
  border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--accent-soft);
  font-size: var(--fs-s); line-height: 1.25; text-align: left;
}
.fchip:hover { border-color: var(--accent); }
.fchip-t { min-width: 0; overflow-wrap: anywhere; }
.fchip-x { flex: none; color: var(--muted); font-size: var(--fs-m); line-height: 1; }
.fchip:hover .fchip-x { color: var(--fg); }

/* ---------- under 900px the panel is a drawer over the content ---------- */
.scrim { position: fixed; inset: 0; z-index: 19; background: var(--backdrop); }
@media (min-width: 900px) { .scrim { display: none; } }
@media (max-width: 899px) {
  .side {
    position: fixed; z-index: 20; top: 0; bottom: 0; left: 0;
    width: min(320px, 88vw); height: auto;
    padding-top: env(safe-area-inset-top, 0px);
    border-right-color: var(--line-strong);
    overscroll-behavior: contain;
  }
  .side-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 16px 8px var(--gutter);
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .side-search { position: static; padding-block: 12px 0; border-bottom: 0; }
  .side-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
  .status kbd { display: none; }
}

/* ---------- grid ---------- */
main { padding: 14px var(--gutter) 40px; }
#sections { display: flex; flex-direction: column; gap: 28px; }
.fam { min-width: 0; }
.fam-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.fam-head h2 { margin: 0; font-size: var(--fs-l); font-weight: 650; }
.fam-n { font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.fam-head p { margin: 0; color: var(--muted); flex: 1 1 28ch; min-width: 0; }
/* columns depend on the width of the main column (it changes when the panel opens), not of the window */
.grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px 16px; }
@container maincol (min-width: 620px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@container maincol (min-width: 960px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@supports not (container-type: inline-size) {
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
}
.fam--retired .grid { opacity: .58; }
.empty { margin: 40px 0; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }

.card { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.frame {
  position: relative; display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 10; padding: 0;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--frame); overflow: hidden;
}
.frame:hover { border-color: var(--accent); }
.frame img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: scale-down; filter: brightness(var(--shot-dim)); }
.frame-empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: var(--fs-s); }
.badge { position: absolute; top: 6px; padding: 1px 5px; border: 1px solid var(--line); border-radius: var(--r); background: var(--field); color: var(--fg); font-size: var(--fs-xs); line-height: 1.35; }
.badge--code { left: 6px; font-family: var(--font-mono); }
.badge--var { right: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
.card-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.card-code { display: none; flex: none; font: var(--fs-xs) var(--font-mono); color: var(--muted); }
.card-name { flex: 1 1 auto; min-width: 0; margin: 0; font-size: var(--fs-m); font-weight: 650; overflow-wrap: anywhere; }
.mark { display: inline-flex; align-items: center; gap: 5px; flex: none; font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
.mk { position: relative; display: inline-block; flex: none; width: 10px; height: 10px; border: 1.5px dotted var(--line-strong); }
.mk[data-st="natywny"] { border: 0; background: var(--st-natywny); }
.mk[data-st="do-przygotowania"] { border: 1.5px solid var(--st-przygotowanie); }
.mk[data-st="brak"] { border: 0; }
.mk[data-st="brak"]::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--st-brak); }
.tags { display: flex; flex-wrap: wrap; gap: 3px; margin: 0; padding: 0; list-style: none; }
.tag { height: 20px; padding: 0 6px; border: 1px solid var(--line); border-radius: var(--r); background: transparent; color: var(--muted); font-size: var(--fs-xs); white-space: nowrap; }
.tag:hover { border-color: var(--line-strong); color: var(--fg); }
.tag[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
.occ { display: flex; flex-wrap: wrap; align-items: baseline; gap: 1px 9px; margin-top: auto; padding-top: 6px; border-top: 1px solid var(--line); font-size: var(--fs-s); line-height: 1.55; }
.occ-label { font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.occ a { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.occ .x { color: var(--muted); font-variant-numeric: tabular-nums; }
.occ-text, .occ-none { color: var(--muted); }
.occ-more { height: 18px; padding: 0 5px; border: 1px solid var(--line-strong); border-radius: var(--r); background: var(--field); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; }
.occ-more:hover { border-color: var(--accent); }

/* dense mode: frame + one line */
[data-density="gesto"] .grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px 10px; }
[data-density="gesto"] .card { gap: 4px; }
[data-density="gesto"] .tags,
[data-density="gesto"] .occ,
[data-density="gesto"] .badge,
[data-density="gesto"] .mark-label { display: none; }
[data-density="gesto"] .card-title { align-items: center; gap: 6px; }
[data-density="gesto"] .card-code { display: inline; }
[data-density="gesto"] .card-name { font-size: var(--fs-s); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
[data-density="gesto"] #sections { gap: 20px; }
@container maincol (max-width: 480px) { [data-density="gesto"] .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- dialog ---------- */
.dlg {
  width: min(1560px, 96vw); height: 92vh; height: 92dvh; max-width: none; max-height: none;
  padding: 0; border: 1px solid var(--line-strong); border-radius: var(--r);
  background: var(--bg); color: var(--fg); overflow: hidden;
}
.dlg::backdrop { background: var(--backdrop, rgba(20, 16, 10, .62)); }
.dlg[open] { display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: auto minmax(0, 1fr); }
.dlg-shot { grid-column: 1; grid-row: 1 / 3; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--frame); border-right: 1px solid var(--line); }
.dlg-bar { grid-column: 2; grid-row: 1; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.dlg-panel { grid-column: 2; grid-row: 2; display: flex; flex-direction: column; gap: 16px; padding: 14px 14px 24px; overflow: auto; overscroll-behavior: contain; min-width: 0; }
.dlg-title { order: 5; flex: 1 0 100%; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin: 0; min-width: 0; font-size: 1.0625rem; font-weight: 650; line-height: 1.25; }
.dlg-code { font: 600 var(--fs-m) var(--font-mono); color: var(--accent); }
.dlg-name { min-width: 0; overflow-wrap: anywhere; text-wrap: balance; }
.dlg-mark { display: none; font-weight: 400; }
.dlg-nav { display: flex; align-items: center; gap: 4px; }
.dlg-nav .t { display: none; }
.dlg-count { min-width: 7ch; text-align: center; font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.dlg-tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
kbd { font: var(--fs-xs) var(--font-mono); color: var(--muted); border: 1px solid var(--line); border-radius: var(--r); padding: 0 4px; background: var(--bg); }

.shot-scroll:focus-visible { outline: 1px solid var(--line-strong); outline-offset: -1px; }
.shot-scroll { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; padding: 14px; overflow: auto; overscroll-behavior: contain; }
.shot-scroll img { display: block; flex: none; width: 100%; height: auto; margin: auto; }
.shot-scroll img.is-small { width: auto; max-width: 100%; }
.shot-empty { margin: auto; color: var(--muted); }
.thumbs { flex: none; display: flex; gap: 8px; padding: 8px 14px; overflow-x: auto; background: var(--bg); border-top: 1px solid var(--line); }
.thumb { flex: none; width: 128px; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--frame); text-align: left; overflow: hidden; }
.thumb img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: scale-down; filter: brightness(var(--shot-dim)); }
.thumb span { display: block; padding: 2px 5px; background: var(--field); border-top: 1px solid var(--line); font-size: var(--fs-xs); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.thumb:hover { border-color: var(--line-strong); }
.thumb[aria-pressed="true"] { border-color: var(--accent); outline: 1px solid var(--accent); }

.dlg-panel section { min-width: 0; }
.dlg-panel h3 { margin: 0 0 6px; font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-variant-numeric: tabular-nums; }
.dlg-skrot { margin: 0; }
.dlg-flag { margin: 0; color: var(--muted); font-size: var(--fs-s); }
.switch { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; }
.switch button { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--field); font-size: var(--fs-s); text-align: left; min-width: 0; }
.switch button:hover { border-color: var(--line-strong); }
.switch button[aria-pressed="true"] { border-color: var(--accent); outline: 1px solid var(--accent); background: var(--accent-soft); }
.switch kbd { margin-left: auto; }
.kv { display: grid; grid-template-columns: 7.2rem minmax(0, 1fr); gap: 5px 8px; margin: 0; }
.kv dt { color: var(--muted); font-size: var(--fs-s); padding-top: 1px; }
.kv dd { display: flex; flex-wrap: wrap; gap: 3px; margin: 0; }
.chip { padding: 1px 6px; border: 1px solid var(--line); border-radius: var(--r); font-size: var(--fs-xs); color: var(--fg); white-space: nowrap; }
.occ-list, .occ-list ul, .var-list { list-style: none; margin: 0; padding: 0; }
.occ-list { display: grid; gap: 10px; }
.occ-list ul { display: grid; gap: 3px; margin-top: 2px; }
.occ-page { font-weight: 650; }
.occ-list a { overflow-wrap: anywhere; }
.occ-list .chip { margin-left: 4px; color: var(--muted); }
.var-list { display: grid; gap: 7px; }
.var-list b { display: block; font: 600 var(--fs-s) var(--font-mono); }
.base-note { margin: 0; color: var(--muted); font-size: var(--fs-s); }
.base-note code { font-family: var(--font-mono); color: var(--fg); }
.tech { border-top: 1px solid var(--line); padding-top: 10px; }
.tech summary { cursor: pointer; font-weight: 600; }
.tech h4 { margin: 14px 0 4px; font-size: var(--fs-xs); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tech p, .tech ul, .tech dl { margin: 0; overflow-wrap: anywhere; }
.tech ul { padding-left: 1.1em; }
.tech dt { font: 600 var(--fs-s) var(--font-mono); margin-top: 6px; }
.tech dd { margin: 0; }

/* screenshots only */
.dlg[data-mode="shots"] { grid-template-columns: minmax(0, 1fr); }
.dlg[data-mode="shots"] .dlg-bar { grid-column: 1; grid-row: 1; flex-wrap: nowrap; }
.dlg[data-mode="shots"] .dlg-shot { grid-column: 1; grid-row: 2; border-right: 0; }
.dlg[data-mode="shots"] .dlg-panel { display: none; }
.dlg[data-mode="shots"] .dlg-title { order: 0; flex: 1 1 auto; flex-wrap: nowrap; }
.dlg[data-mode="shots"] .dlg-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dlg[data-mode="shots"] .dlg-mark { display: inline-flex; }
.dlg[data-mode="shots"] .dlg-tools { margin-left: 0; }
@media (min-width: 900px) { .dlg[data-mode="shots"] .dlg-nav .t { display: inline; } }

@media (max-width: 899px) {
  .dlg[open] { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr); }
  .dlg-bar { grid-column: 1; grid-row: 1; }
  .dlg-shot { grid-column: 1; grid-row: 2; max-height: 46vh; max-height: 46dvh; border-right: 0; border-bottom: 1px solid var(--line); }
  .dlg-panel { grid-column: 1; grid-row: 3; }
  .dlg[data-mode="shots"][open] { grid-template-rows: auto minmax(0, 1fr); }
  .dlg[data-mode="shots"] .dlg-bar { flex-wrap: wrap; }
  .dlg[data-mode="shots"] .dlg-title { order: 5; flex: 1 0 100%; }
  .dlg[data-mode="shots"] .dlg-tools { margin-left: auto; }
  .dlg[data-mode="shots"] .dlg-shot { max-height: none; border-bottom: 0; }
}
@media (max-width: 599px) {
  .dlg { width: 100%; height: 100%; max-width: 100%; max-height: 100%; margin: 0; border: 0; }
  .dlg-bar { padding-top: calc(10px + env(safe-area-inset-top, 0px)); }
  .dlg-panel { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)); }
  .shot-scroll { padding: 10px; }
}

@media (prefers-reduced-motion: no-preference) {
  .pill, .fchip, .tag, .btn, .frame, .thumb, .switch button { transition: border-color .12s ease, background-color .12s ease, color .12s ease; }
}

/* ---------- page footer: one line ---------- */
.foot { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 16px; padding: 10px var(--gutter) 18px; border-top: 1px solid var(--line); font-size: var(--fs-s); color: var(--muted); font-variant-numeric: tabular-nums; }
.foot span { margin-left: auto; }
/* read-only project state in the CE window */
.dlg-proj { margin: 0; font-size: var(--fs-s); color: var(--fg); }
</style>

<header class="top">
  <h1>Indeks CE</h1>
  <p id="meta"></p>

<div class="shell" id="shell">
  <div class="scrim" id="scrim" hidden></div>
  <aside class="side" id="side" aria-label="Filtry i widok" hidden>
    <div class="side-head">
      <p class="side-title">Filtry<span id="side-count"></span></p>
      <button class="btn btn--icon" id="side-close" type="button" aria-label="Zamknij panel filtrów" title="Zamknij (Esc)"><span aria-hidden="true">✕</span></button>
    </div>
    <div class="side-sec side-search">
      <label class="vh" for="q">Szukaj CE po kodzie, nazwie lub skrócie</label>
      <input class="input" id="q" type="search" placeholder="Szukaj: kod, nazwa, skrót" title="Szukaj (klawisz /)" autocomplete="off" spellcheck="false">
    </div>
    <div class="side-sec" role="group" aria-labelledby="view-label">
      <p class="side-label" id="view-label">Widok</p>
      <div class="seg" role="group" aria-label="Gęstość siatki">
        <button id="dens-karty" type="button" aria-pressed="true">3 kolumny</button>
        <button id="dens-gesto" type="button" aria-pressed="false">gęsto</button>
      </div>
      <label class="vh" for="sort">Sortowanie</label>
      <select class="input" id="sort">
        <option value="rodzina">wg rodziny</option>
        <option value="wystapienia">wg liczby wystąpień</option>
        <option value="kod">wg kodu</option>
      </select>
      <label class="check"><input id="retired" type="checkbox"><span>Pokaż wycofane (<span id="retired-n"></span>)</span></label>
    </div>
    <div id="facets"></div>
    <div class="side-foot">
      <div class="side-actions">
        <button class="btn" id="clear" type="button" disabled>Wyczyść filtry</button>
        <button class="btn" id="copy" type="button">Kopiuj oznaczenia</button>
      </div>
      <p class="note" id="copy-note">Oznaczenia zapisują się tylko w tej przeglądarce – skopiuj je i przekaż do wpisania w rejestr.</p>
      <p class="note note--status" id="copy-status" role="status"></p>
      <div class="manual" id="copy-manual" hidden>
        <label for="copy-text" id="copy-manual-label"></label>
        <textarea id="copy-text" readonly spellcheck="false"></textarea>
        <button class="btn" id="copy-manual-close" type="button">Zamknij</button>
      </div>
    </div>
  </aside>

  <div class="content" id="content">
    <div class="status" id="status">
      <button class="btn" id="side-btn" type="button" aria-expanded="false" aria-controls="side" aria-keyshortcuts="f" title="Pokaż lub ukryj panel filtrów (klawisz f)"><svg class="ico" viewBox="0 0 12 12" width="12" height="12" aria-hidden="true" focusable="false"><path d="M1 2.5h10M3 6h6M5 9.5h2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square"/></svg>Filtry<span class="btn-n" id="side-n" hidden></span><kbd aria-hidden="true">f</kbd></button>
      <span class="count" id="count" role="status"></span>
      <span class="chips" id="chips"></span>
      <button class="btn btn--s" id="status-clear" type="button" hidden>Wyczyść</button>
    </div>
    <main id="main" data-density="karty">
      <div id="sections"></div>
      <p class="empty" id="empty" hidden>
        <span>Żaden CE nie pasuje do tych filtrów.</span>
        <button class="btn" id="empty-clear" type="button">Wyczyść filtry</button>
      </p>
    </main>
    <footer class="foot">
      <a href="stan-podstron.html">Stan podstron</a>
      <a href="style-guide.html">Style guide</a>
      <span id="foot-date"></span>
    </footer>
  </div>
</div>

<dialog class="dlg" id="dlg" aria-labelledby="dlg-title">
  <header class="dlg-bar">
    <h2 class="dlg-title" id="dlg-title">
      <span class="dlg-code" id="dlg-code"></span>
      <span class="dlg-name" id="dlg-name"></span>
      <span class="mark dlg-mark" id="dlg-mark" role="img"><span class="mk"></span><span class="mark-label"></span></span>
    </h2>
    <div class="dlg-nav">
      <button class="btn" id="dlg-prev" type="button" aria-label="Poprzedni CE" title="Poprzedni CE (←)"><span aria-hidden="true">←</span><span class="t">poprzedni</span></button>
      <span class="dlg-count" id="dlg-count"></span>
      <button class="btn" id="dlg-next" type="button" aria-label="Następny CE" title="Następny CE (→)"><span class="t">następny</span><span aria-hidden="true">→</span></button>

    <div class="dlg-tools">
      <button class="btn" id="dlg-mode" type="button" aria-pressed="false" title="Pokaż same zrzuty (klawisz i)">Same zrzuty <kbd>i</kbd></button>
      <button class="btn btn--icon" id="dlg-close" type="button" aria-label="Zamknij okno CE" title="Zamknij (Esc)"><span aria-hidden="true">✕</span></button>
    </div>
  </header>
  <div class="dlg-shot">
    <div class="shot-scroll" id="dlg-scroll" tabindex="0" role="group" aria-label="Zrzut CE">

      <p class="shot-empty" id="dlg-noimg" hidden>Ten CE nie ma zrzutu.</p>
    </div>
    <div class="thumbs" id="dlg-thumbs" hidden></div>
  </div>
  <div class="dlg-panel" id="dlg-panel"></div>
</dialog>

<script src="ce-indeks/dane.js"></script>
<script>
(function () {
  'use strict';

  var DATA = window.CE_DANE;
  var byId = function (id) { return document.getElementById(id); };
  var rootEl = document.documentElement;
  if (!rootEl.lang) rootEl.lang = 'pl';

  if (!DATA || !Array.isArray(DATA.ce)) {
    byId('sections').innerHTML = '<p class="empty">Nie udało się wczytać danych CE (plik ce-indeks/dane.js).</p>';
    return;
  }

  // ---------- helpers ----------
  var ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ESC[c]; }); }
  function plural(n, one, few, many) {
    var m10 = n % 10, m100 = n % 100;
    if (n === 1) return one;
    if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
    return many;
  }
  function fold(s) {
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ł/g, 'l');
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function loadJSON(key) {
    try { var raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function saveJSON(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage unavailable – state stays in memory */ }
  }

  // ---------- model ----------
  var META = DATA.meta || {};
  var PAGE_BASE = META.bazaStron || '';
  var SITE_BASE = PAGE_BASE.replace(/v7\/$/, '');
  var STORE_MARKS = 'ce-projekt-v1';
  var STORE_VIEW = 'ce-indeks-widok-v1';
  var UNSET = 'nieustalone';
  var DIM_PROJECT = '@projekt';
  var DIM_PAGE = '@strona';
  var VAL_SHARED = '@wspolne';
  var SHORT_STATE = { 'natywny': 'natywny', 'do-przygotowania': 'do przygotowania', 'brak': 'brak' };

  var projStates = ((DATA.projekt && DATA.projekt.stany) || []).map(function (s) {
    return { key: s.klucz, name: s.nazwa, short: SHORT_STATE[s.klucz] || String(s.nazwa).toLowerCase() };
  });
  projStates.push({ key: UNSET, name: 'Nieustalone', short: 'nieustalone' });
  var projByKey = {};
  var hotkeys = {};
  projStates.forEach(function (s, i) {
    projByKey[s.key] = s;
    s.hot = s.key === UNSET ? '0' : String(i + 1);
    hotkeys[s.hot] = s.key;
  });

  // Edit mode: opened from disk or from a local server, or forced with ?edycja=1;
  // ?edycja=0 forces read-only. Only in edit mode can the project state be marked
  // (switch, keys 1/2/3/0, copy button) and do local marks override the data.
  var EDIT = (function () {
    var m = /[?&]edycja=([01])(?:&|$)/.exec(location.search || '');
    if (m) return m[1] === '1';
    return location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  })();
  rootEl.dataset.edit = EDIT ? '1' : '0';

  var marks = EDIT ? loadJSON(STORE_MARKS) : null;
  if (!marks || typeof marks !== 'object' || Array.isArray(marks)) marks = {};

  function effState(ce) {
    var m = marks[ce.kod];
    if (m && projByKey[m]) return m;
    return ce.projekt && projByKey[ce.projekt] ? ce.projekt : UNSET;
  }

  var facets = DATA.fasety || [];
  var groupFacet = facets.filter(function (f) { return f.grupuje; })[0] || null;

  var items = DATA.ce.map(function (ce, i) {
    var pages = [];
    var pageIdx = {};
    (ce.wystapienia || []).forEach(function (o) {
      if (pageIdx[o.plik] == null) { pageIdx[o.plik] = pages.length; pages.push({ plik: o.plik, strona: o.strona, list: [] }); }
      pages[pageIdx[o.plik]].list.push(o);
    });
    return {
      ce: ce,
      num: parseInt(String(ce.kod).replace(/\D+/g, ''), 10) || i,
      retired: ce.status !== 'aktywny',
      hay: fold([ce.kod, ce.nazwa, ce.skrot].join(' ')),
      occCount: (ce.wystapienia || []).length,
      pages: pages,
      vals: {},
      visible: null,
      card: null, markEl: null, occLinks: null, occMore: null, fitW: 0
    };
  });
  var byCode = {};
  items.forEach(function (it) { byCode[it.ce.kod] = it; });

  // filter dimensions: data facets + project state + page
  var dims = facets.map(function (f) {
    return {
      key: f.klucz, label: f.nazwa, main: !!f.glowny, onCard: !!f.naKarcie,
      values: (f.wartosci || []).map(function (v) { return { key: v.klucz, label: v.nazwa, hint: v.opis || '' }; })
    };
  });
  dims.push({
    key: DIM_PROJECT, label: 'Projekt graficzny', main: true, onCard: false, marker: true,
    values: projStates.map(function (s) { return { key: s.key, label: s.short, hint: s.name }; })
  });
  var pageValues = [];
  var seenPage = {};
  items.forEach(function (it) {
    it.pages.forEach(function (p) {

  // one removable chip per active filter; ref = { dim, val } or null for the search phrase

  function applyFilters() {
    var tokens = fold(state.query).split(/\s+/).filter(Boolean);

    var counts = {};
    dims.forEach(function (d) { counts[d.key] = {}; });
    var shown = 0, scope = 0;

    items.forEach(function (it) {
      var inScope = state.retired || !it.retired;
      var vis = false;
      if (inScope) {
        scope++;
        var hit = tokens.every(function (t) { return it.hay.indexOf(t) >= 0; });
        if (hit) {
          var failing = activeDims.filter(function (d) {
            var sel = state.sel[d.key];
            return !it.vals[d.key].some(function (v) { return sel[v]; });
          });
          if (failing.length === 0) {
            vis = true;
            dims.forEach(function (d) {
              it.vals[d.key].forEach(function (v) { counts[d.key][v] = (counts[d.key][v] || 0) + 1; });
            });
          } else if (failing.length === 1) {
            // would match if this one facet were released, so it counts toward that facet's values
            var d1 = failing[0];
            it.vals[d1.key].forEach(function (v) { counts[d1.key][v] = (counts[d1.key][v] || 0) + 1; });
          }
        }
      }
      if (it.visible !== vis) { it.visible = vis; it.card.hidden = !vis; }
      if (vis) shown++;

    dims.forEach(function (d) {
      d.values.forEach(function (v) {
        var p = pillEls[d.key][v.key];
        var n = counts[d.key][v.key] || 0;

      var n = 0;

    sideCount.textContent = shown + ' z ' + scope;

      g.n.textContent = keys.length;

      keys.forEach(function (k) {
        nActive++;

      });
    });

    chipsEl.appendChild(frag);
    clearBtn.disabled = nActive === 0;
    statusClear.hidden = nActive === 0;
    sideN.hidden = nActive === 0;
    sideN.textContent = nActive;

  }

  function toggleValue(dimKey, valKey) {

  // ---------- "Występuje na": at most two lines, the rest as +N ----------
  function lineOf(node, tops) {
    var t = node.getBoundingClientRect().top;
    for (var i = 0; i < tops.length; i++) { if (Math.abs(tops[i] - t) < 10) return i; }
    tops.push(t);
    return tops.length - 1;
  }
  function fitCard(it) {
    var links = it.occLinks, more = it.occMore;
    var i;
    for (i = 0; i < links.length; i++) links[i].hidden = false;
    more.hidden = true;
    var tops = [];
    lineOf(it.occLabel, tops);
    var cut = -1;
    for (i = 0; i < links.length; i++) {
      if (lineOf(links[i], tops) >= 2) { cut = i; break; }
    }
    if (cut < 0) return;
    for (i = cut; i < links.length; i++) links[i].hidden = true;
    var hiddenN = links.length - cut;
    more.hidden = false;
    more.textContent = '+' + hiddenN;
    var guard = 0;
    while (cut > 1 && guard++ < 6) {
      var t2 = [];
      lineOf(it.occLabel, t2);
      for (i = 0; i < cut; i++) lineOf(links[i], t2);
      if (lineOf(more, t2) < 2) break;
      cut--;
      links[cut].hidden = true;
      hiddenN++;
      more.textContent = '+' + hiddenN;
    }
    more.setAttribute('aria-label', 'Jeszcze ' + hiddenN + ' ' + plural(hiddenN, 'podstrona', 'podstrony', 'podstron') + ' – otwórz okno CE');
  }

      if (!it.visible || !it.occMore || it.occLinks.length < 2) return;
      var w = it.card.clientWidth;
      if (!w || w === it.fitW) return;
      it.fitW = w;
      fitCard(it);
    });

  }

  // ---------- side panel: inline column from 900px, drawer below ----------

    if (lock) {

  function isTextField(t) {

    if (e.key === 'Escape') {
      if (sideOpen && isDrawer()) { e.preventDefault(); closeDrawer(); }
      return;
    }
    if (isTextField(e.target)) return;
    if (e.key === '/') {
      e.preventDefault();
      if (!sideOpen) setSide(true, true);
      qEl.focus();
      qEl.select();
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      setSide(!sideOpen, true);
      if (sideOpen && isDrawer()) byId('side-close').focus();
    }
  });

  // ---------- copy marks ----------
  var copyNote = byId('copy-note');
  var copyStatus = byId('copy-status');
  var manualEl = byId('copy-manual');
  var manualText = byId('copy-text');
  var statusTimer = 0;
  function say(msg) {
    copyStatus.textContent = msg;
    copyNote.hidden = true;
    clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { copyStatus.textContent = ''; copyNote.hidden = false; }, 6000);
  }
  if (!EDIT) {
    ['copy', 'copy-note', 'copy-status', 'copy-manual'].forEach(function (id) { var n = byId(id); if (n) n.remove(); });
  }
  if (EDIT) byId('copy').addEventListener('click', function () {
    var out = {};
    var n = 0;
    items.forEach(function (it) {
      var s = effState(it.ce);
      if (s !== UNSET) { out[it.ce.kod] = s; n++; }
    });
    if (!n) {
      say('Nie ma jeszcze żadnych oznaczeń – ustaw stan w oknie CE.');
      return;
    }
    var text = JSON.stringify(out, null, 2);
    var what = n + ' ' + plural(n, 'oznaczenie', 'oznaczenia', 'oznaczeń');
    function done() { manualEl.hidden = true; say('Skopiowano ' + what + ' do schowka.'); }
    function manual() {
      byId('copy-manual-label').textContent = 'Schowek jest niedostępny. Zaznaczone ' + what + ' – skopiuj ręcznie (Cmd/Ctrl + C).';
      manualText.value = text;
      manualEl.hidden = false;
      manualText.focus();
      manualText.select();
    }
    try {
      navigator.clipboard.writeText(text).then(done, manual);
    } catch (err) {
      manual();
    }
  });
  if (EDIT) byId('copy-manual-close').addEventListener('click', function () { manualEl.hidden = true; byId('copy').focus(); });

  // ---------- dialog ----------
  var dlg = byId('dlg');
  var dlgImg = byId('dlg-img');
  var dlgNoImg = byId('dlg-noimg');
  var dlgScroll = byId('dlg-scroll');
  var dlgThumbs = byId('dlg-thumbs');
  var dlgPanel = byId('dlg-panel');
  var dlgMark = byId('dlg-mark');
  var dlgCount = byId('dlg-count');
  var dlgPrev = byId('dlg-prev');
  var dlgNext = byId('dlg-next');
  var dlgMode = byId('dlg-mode');
  var current = null;
  var navList = [];
  var techOpen = false;
  var shotsOnly = false;
  var preloaded = {};

  function setHash(kod) {
    try {
      history.replaceState(null, '', kod ? '#' + kod : location.pathname + location.search);
    } catch (e) {
      try { location.hash = kod || ''; } catch (e2) { /* hash unavailable in this frame */ }
    }
  }
  function showShot(z, label) {
    if (!z) {
      dlgImg.hidden = true;
      dlgImg.removeAttribute('src');
      dlgNoImg.hidden = false;
      return;
    }
    dlgNoImg.hidden = true;
    dlgImg.hidden = false;
    dlgImg.width = z.w;
    dlgImg.height = z.h;
    dlgImg.classList.toggle('is-small', z.w < 1000);
    dlgImg.alt = 'Zrzut ' + current.ce.kod + ' – ' + current.ce.nazwa + ' (' + label + ')';
    dlgImg.src = z.pelny;
    dlgScroll.scrollTop = 0;
  }
  function renderThumbs(ce) {
    var shots = [];
    if (ce.zrzut) shots.push({ label: 'wersja bazowa', z: ce.zrzut });
    (ce.warianty || []).forEach(function (v) { if (v.zrzut) shots.push({ label: v.slug, z: v.zrzut }); });
    dlgThumbs.textContent = '';
    dlgThumbs.hidden = shots.length < 2;
    if (shots.length < 2) return;
    shots.forEach(function (s, i) {
      var b = el('button', 'thumb');
      b.type = 'button';
      b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
      b.title = s.label;
      var im = document.createElement('img');
      im.src = s.z.mini;
      im.alt = '';
      im.loading = 'lazy';
      im.decoding = 'async';
      b.appendChild(im);
      b.appendChild(el('span', '', s.label));
      b.addEventListener('click', function () {
        Array.prototype.forEach.call(dlgThumbs.children, function (c) { c.setAttribute('aria-pressed', c === b ? 'true' : 'false'); });
        showShot(s.z, s.label);
      });
      dlgThumbs.appendChild(b);
    });
  }
  function renderPanel(it) {
    var ce = it.ce;
    var prevTech = byId('dlg-tech');
    if (prevTech) techOpen = prevTech.open;
    var st = effState(ce);
    var h = '';
    if (ce.skrot) h += '<p class="dlg-skrot">' + esc(ce.skrot) + '</p>';
    if (it.retired) h += '<p class="dlg-flag">CE wycofany – kod zostaje w rejestrze.</p>';

    if (EDIT) {
      h += '<section><h3 id="dlg-proj-label">Projekt graficzny</h3><div class="switch" id="dlg-switch" role="group" aria-labelledby="dlg-proj-label">';
      projStates.forEach(function (s) {
        h += '<button type="button" data-st="' + esc(s.key) + '" aria-pressed="' + (s.key === st ? 'true' : 'false') + '" title="' + esc(s.name) + ' (klawisz ' + s.hot + ')">' +
          '<span class="mk" data-st="' + esc(s.key) + '"></span><span>' + esc(s.short) + '</span><kbd>' + s.hot + '</kbd></button>';
      });
      h += '</div></section>';
    } else {
      var ps = projByKey[st] || projByKey[UNSET];
      h += '<section><h3>Projekt graficzny</h3><p class="mark dlg-proj" id="dlg-proj"><span class="mk" data-st="' + esc(ps.key) + '"></span>' +
        '<span class="mark-label">' + esc(ps.name) + '</span></p></section>';
    }

    var kv = '';
    facets.forEach(function (f) {
      var vals = it.vals[f.klucz];
      if (!vals.length) return;
      var d = dimByKey[f.klucz];
      kv += '<dt>' + esc(f.nazwa) + '</dt><dd>' + vals.map(function (v) { return '<span class="chip">' + esc(d.labelOf[v] || v) + '</span>'; }).join('') + '</dd>';
    });
    if (kv) h += '<section><h3>Cechy</h3><dl class="kv">' + kv + '</dl></section>';

    h += '<section><h3>Występuje na';
    if (it.occCount) {
      h += ' · ' + it.occCount + ' ' + plural(it.occCount, 'wystąpienie', 'wystąpienia', 'wystąpień') + ', ' +
        it.pages.length + ' ' + plural(it.pages.length, 'podstrona', 'podstrony', 'podstron');
    }
    h += '</h3>';
    if (it.pages.length) {
      h += '<ul class="occ-list">';
      it.pages.forEach(function (p) {
        h += '<li><span class="occ-page">' + esc(p.strona) + '</span><ul>';
        p.list.forEach(function (o) {
          h += '<li><a href="' + esc(PAGE_BASE + o.plik + '#' + o.id) + '" target="_blank" rel="noopener">#' + esc(o.id) +
            (o.naglowek ? ' – ' + esc(o.naglowek) : '') + '</a>' +
            (o.wariant ? '<span class="chip" title="Wariant">' + esc(o.wariant) + '</span>' : '') + '</li>';
        });
        h += '</ul></li>';
      });
      h += '</ul>';
    } else if (ce.wspolny) {
      h += '<p class="base-note">' + esc(ce.wspolny) + '</p>';
    } else {
      h += '<p class="base-note">bez wystąpień</p>';
    }
    h += '</section>';

    if (ce.baza && ce.baza.plik) {
      if (/\.html?$/.test(ce.baza.plik)) {
        h += '<div><a class="btn" href="' + esc(SITE_BASE + ce.baza.plik + '#' + ce.baza.kotwica) + '" target="_blank" rel="noopener">Otwórz wersję bazową <span aria-hidden="true">↗</span></a></div>';
      } else {
        h += '<p class="base-note">Wersja bazowa: <code>' + esc(ce.baza.plik) + '</code> (plik wspólny, bez własnej podstrony).</p>';
      }
    }

    var vars = ce.warianty || [];
    if (vars.length) {
      h += '<section><h3>Warianty · ' + vars.length + '</h3><ul class="var-list">';
      vars.forEach(function (v) { h += '<li><b>' + esc(v.slug) + '</b>' + esc(v.skrot || '') + '</li>'; });
      h += '</ul></section>';
    }

    var t = '';
    if (ce.opis) t += '<h4>Opis</h4><p>' + esc(ce.opis) + '</p>';
    if (ce.mechanika) t += '<h4>Mechanika</h4><p>' + esc(ce.mechanika) + '</p>';
    if (ce.czesci && ce.czesci.length) t += '<h4>Części</h4><ul>' + ce.czesci.map(function (c) { return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';
    if (vars.length) t += '<h4>Warianty</h4><dl>' + vars.map(function (v) { return '<dt>' + esc(v.slug) + '</dt><dd>' + esc(v.opis || '') + '</dd>'; }).join('') + '</dl>';
    var src = ce.kod_zrodlowy || {};
    if (src.css || src.js) {
      t += '<h4>Gdzie w kodzie</h4><dl>' + (src.css ? '<dt>CSS</dt><dd>' + esc(src.css) + '</dd>' : '') + (src.js ? '<dt>JS</dt><dd>' + esc(src.js) + '</dd>' : '') + '</dl>';
    }
    if (t) h += '<details class="tech" id="dlg-tech"' + (techOpen ? ' open' : '') + '><summary>Opis techniczny – dla wdrożenia</summary>' + t + '</details>';

    dlgPanel.innerHTML = h;
    dlgPanel.scrollTop = 0;
  }
  function paintDialogState() {
    if (!current) return;
    var st = effState(current.ce);
    paintMark(dlgMark, st);
    var sw = byId('dlg-switch');
    if (sw) {
      Array.prototype.forEach.call(sw.children, function (b) { b.setAttribute('aria-pressed', b.dataset.st === st ? 'true' : 'false'); });
    }
  }
  function showItem(it) {
    current = it;
    byId('dlg-code').textContent = it.ce.kod;
    byId('dlg-name').textContent = it.ce.nazwa;
    var idx = navList.indexOf(it);
    dlgCount.textContent = (idx >= 0 ? idx + 1 : '–') + ' / ' + navList.length;
    // aria-disabled, not disabled: a focused disabled button would swallow the arrow keys
    dlgPrev.setAttribute('aria-disabled', navList.length === 0 || idx === 0 ? 'true' : 'false');
    dlgNext.setAttribute('aria-disabled', navList.length === 0 || idx === navList.length - 1 ? 'true' : 'false');
    renderPanel(it);
    renderThumbs(it.ce);
    showShot(it.ce.zrzut, 'wersja bazowa');
    paintDialogState();
    setHash(it.ce.kod);
    // re-rendering removes the focused node (a variant thumbnail, a link in the panel);
    // keep the focus inside the dialog so the arrow keys keep working
    if (!dlg.contains(document.activeElement) || document.activeElement === dlg) dlgScroll.focus({ preventScroll: true });
    // warm the cache for both neighbours so arrow keys feel instant
    [navList[idx - 1], navList[idx + 1]].forEach(function (n) {
      if (!n || !n.ce.zrzut || preloaded[n.ce.zrzut.pelny]) return;
      var pre = new Image();
      pre.decoding = 'async';
      pre.src = n.ce.zrzut.pelny;
      preloaded[n.ce.zrzut.pelny] = pre;   // keep a reference so the request is not dropped mid-flight
    });
  }
  function openDialog(kod) {
    var it = byCode[kod];
    if (!it) return;
    if (!dlg.open) {
      navList = order.filter(function (i) { return i.visible; });
      dlg.showModal();
      syncLock();
      dlgScroll.focus({ preventScroll: true });
    }
    showItem(it);
  }
  function step(delta) {
    if (!current || !navList.length) return;
    var idx = navList.indexOf(current);
    var next = idx < 0 ? (delta > 0 ? 0 : navList.length - 1) : idx + delta;
    if (next < 0 || next >= navList.length) return;
    showItem(navList[next]);
  }
  function setShotsOnly(on) {
    shotsOnly = on;
    if (on) dlg.dataset.mode = 'shots'; else delete dlg.dataset.mode;
    dlgMode.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
  function setMark(kod, st) {
    var it = byCode[kod];
    if (!EDIT || !it || !projByKey[st]) return;
    var base = it.ce.projekt && projByKey[it.ce.projekt] ? it.ce.projekt : UNSET;
    if (st === base) delete marks[kod]; else marks[kod] = st;
    saveJSON(STORE_MARKS, marks);
    it.vals[DIM_PROJECT] = [effState(it.ce)];
    paintMark(it.markEl, effState(it.ce));
    paintDialogState();
    applyFilters();
  }

  dlgPrev.addEventListener('click', function () { step(-1); });
  dlgNext.addEventListener('click', function () { step(1); });
  dlgMode.addEventListener('click', function () { setShotsOnly(!shotsOnly); });
  byId('dlg-close').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  dlg.addEventListener('close', function () {
    syncLock();
    current = null;
    setHash('');
  });
  dlgPanel.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('#dlg-switch button') : null;
    if (b && current) setMark(current.ce.kod, b.dataset.st);
  });
  dlg.addEventListener('keydown', function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
    if (e.key === 'ArrowLeft') { e.preventDefault(); step(-1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'i' || e.key === 'I') { e.preventDefault(); setShotsOnly(!shotsOnly); }
    else if (EDIT && hotkeys[e.key] && current) { e.preventDefault(); setMark(current.ce.kod, hotkeys[e.key]); }
  });

  mainEl.addEventListener('click', function (e) {
    if (!e.target.closest) return;
    var tag = e.target.closest('.tag');
    if (tag) { toggleValue(tag.dataset.dim, tag.dataset.val); return; }
    var opener = e.target.closest('.frame, .occ-more');
    if (opener) {
      var card = opener.closest('.card');
      if (card) openDialog(card.dataset.kod);
    }
  });

  function openFromHash() {
    var k = '';
    try { k = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) { k = ''; }
    if (k && byCode[k] && !(dlg.open && current && current.ce.kod === k)) openDialog(k);
  }
  window.addEventListener('hashchange', openFromHash);

  // ---------- boot ----------
  layout();
  setDensity(state.density);
  applyFilters();
  setSide(isDrawer() ? false : defaultSide(), false);
  openFromHash();
})();
</script>
</body>
</html>
